name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.26"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check src/ tests/ docker_entrypoint.py
      - run: uv run --frozen ruff format --check src/ tests/ docker_entrypoint.py
      - run: uv run --frozen mypy src/
      - run: uv run --frozen pytest -q -o addopts='' --ignore=tests/test_integration.py --ignore=tests/test_live_api.py
      - run: uv build --out-dir dist/
      - name: Verify Railway container build
        if: matrix.python == '3.14'
        run: docker build --tag playstore-mcp-bridge:ci .
